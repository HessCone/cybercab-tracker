name: Update Cybercab count

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07
    - cron: "1 6 * * *"   # 12:01 AM Central (CST) daily full refresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Texas DMV roster
        run: python fetch.py
      - name: Commit data if changed
        run: |
          git config user.name "cybercab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
